<style>
  :root {
    --merah: #dc1e28;
    --merah-gelap: #6e0a10;
    --teks: #f5f5f5;
    --redup: #b9b9b9;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { min-height: 100%; }
  body {
    font-family: "Poppins", system-ui, sans-serif;
    color: var(--teks);
    background: #07070a;
    overflow-x: hidden;
  }
  /* background: gradasi merah-hitam + logo NX besar samar + percikan */
  .bg {
    position: fixed; inset: 0; z-index: 0;
    background:
      radial-gradient(ellipse at 50% 0%, rgba(220,30,40,.35), transparent 60%),
      radial-gradient(ellipse at 50% 100%, rgba(110,10,16,.55), transparent 65%),
      #07070a;
  }
  .bg::before {
    content: ""; position: absolute; inset: -10%;
    background: url("nx_logo.webp") center 42% / min(160vw, 1300px) no-repeat;
    opacity: .13; filter: blur(1px) saturate(1.3);
    animation: napas 7s ease-in-out infinite;
  }
  .bg::after {
    content: ""; position: absolute; inset: 0;
    background: radial-gradient(circle at 50% 45%, transparent 35%, rgba(0,0,0,.75));
  }
  @keyframes napas { 50% { transform: scale(1.05); opacity: .18; } }
  .api { position: fixed; inset: 0; z-index: 1; pointer-events: none; overflow: hidden; }
  .api i {
    position: absolute; bottom: -10px; width: 4px; height: 4px; border-radius: 50%;
    background: var(--merah); box-shadow: 0 0 8px var(--merah);
    animation: naik linear infinite; opacity: 0;
  }
  @keyframes naik {
    10% { opacity: .9; }
    100% { transform: translateY(-105vh) translateX(var(--geser)); opacity: 0; }
  }

  main {
    position: relative; z-index: 2;
    width: 100%; max-width: 460px; margin: 0 auto;
    padding: 48px 16px 40px;
    display: flex; flex-direction: column; align-items: center; text-align: center;
  }
  .avatar {
    width: 118px; height: 118px; border-radius: 50%;
    background: #000 url("nx_logo.webp") center / 150% no-repeat;
    border: 3px solid var(--merah);
    box-shadow: 0 0 0 6px rgba(220,30,40,.15), 0 0 40px rgba(220,30,40,.55);
    animation: denyut 3s ease-in-out infinite;
  }
  @keyframes denyut { 50% { box-shadow: 0 0 0 10px rgba(220,30,40,.08), 0 0 60px rgba(220,30,40,.8); } }
  .logo { width: min(330px, 86vw); margin: 18px 0 4px; filter: drop-shadow(0 6px 18px rgba(220,30,40,.45)); }
  .tag { color: var(--redup); font-size: 14px; margin-bottom: 26px; }
  .tag b { color: var(--teks); }

  .tombol {
    position: relative; overflow: hidden;
    display: flex; align-items: center; gap: 14px;
    width: 100%; padding: 15px 18px; margin-bottom: 14px;
    border-radius: 14px; text-decoration: none; color: var(--teks);
    background: linear-gradient(135deg, rgba(30,30,36,.85), rgba(14,14,18,.9));
    border: 1px solid rgba(220,30,40,.45);
    box-shadow: 0 6px 20px rgba(0,0,0,.45);
    transition: transform .15s, border-color .15s, box-shadow .15s;
  }
  .tombol:hover, .tombol:focus-visible {
    transform: translateY(-2px); border-color: var(--merah);
    box-shadow: 0 8px 26px rgba(220,30,40,.35); outline: none;
  }
  .tombol::after {
    content: ""; position: absolute; top: 0; left: -60%; width: 40%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,.12), transparent);
    transform: skewX(-20deg); animation: kilap 4s ease-in-out infinite;
  }
  @keyframes kilap { 0%, 60% { left: -60%; } 100% { left: 130%; } }
  .tombol.utama {
    background: linear-gradient(135deg, var(--merah), var(--merah-gelap));
    border-color: #ff4a53;
  }
  .ikon {
    flex: 0 0 42px; height: 42px; border-radius: 10px;
    display: grid; place-items: center; background: rgba(0,0,0,.35);
  }
  .ikon svg { width: 24px; height: 24px; fill: #fff; }
  .isi { flex: 1; text-align: left; min-width: 0; }
  .isi strong { display: block; font-size: 16px; font-weight: 700; }
  .isi span { display: block; font-size: 12.5px; color: rgba(255,255,255,.72); }
  .panah { font-size: 20px; opacity: .7; }

  footer { margin-top: 18px; font-size: 12px; color: #777; }
</style>

<script>
  // percikan api naik di background
  const api = document.getElementById("api");
  for (let n = 0; n < 26; n++) {
    const p = document.createElement("i");
    p.style.left = Math.random() * 100 + "%";
    p.style.animationDuration = 6 + Math.random() * 8 + "s";
    p.style.animationDelay = -Math.random() * 12 + "s";
